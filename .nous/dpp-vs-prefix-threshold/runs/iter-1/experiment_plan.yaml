metadata:
  iteration: 1
  bundle_ref: "runs/iter-1/bundle.yaml"
  description: "Rate sweep comparing 4 disaggregation policies (Never, Always, PrefixThreshold N=16, DPP V=100 SLO=50ms) on 1P+1D topology with prefix-heavy workload"

setup:
  - cmd: "go build -o blis ."
    description: "Build BLIS binary"

arms:
  # h-main: Tests DPP(V=100) equivalence to AlwaysDisaggregate across load sweep
  - arm_id: "h-main"
    conditions:
      # Rate sweep: Always vs DPP(V=100) — predicted to be within 1% at all rates
      - name: "always_rate5"
        cmd: "./blis run --model qwen/qwen3-14b --prefill-instances 1 --decode-instances 1 --num-instances 2 --pd-decider always --rate 5 --num-requests 2000 --prompt-tokens 512 --prefix-tokens 480 --output-tokens 128 --seed 42 --metrics-path /Users/vishakha/git-repos/llm-git-repos/inference-sim/.nous/dpp-vs-prefix-threshold/runs/iter-1/results/h-main/always_rate5.json"
        output: "/Users/vishakha/git-repos/llm-git-repos/inference-sim/.nous/dpp-vs-prefix-threshold/runs/iter-1/results/h-main/always_rate5.json"

      - name: "dpp_v100_slo50_rate5"
        cmd: "./blis run --model qwen/qwen3-14b --prefill-instances 1 --decode-instances 1 --num-instances 2 --pd-decider dpp --dpp-v 100 --dpp-ttft-slo-d 50 --rate 5 --num-requests 2000 --prompt-tokens 512 --prefix-tokens 480 --output-tokens 128 --seed 42 --metrics-path /Users/vishakha/git-repos/llm-git-repos/inference-sim/.nous/dpp-vs-prefix-threshold/runs/iter-1/results/h-main/dpp_v100_slo50_rate5.json"
