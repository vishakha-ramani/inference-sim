metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  research_question: "Does DPP's Z-feedback mechanism produce a V/SLO regime where partial disaggregation outperforms PrefixThreshold(N=16) on mean ITL, or is partial disaggregation a dominated strategy in the 1P+1D topology?"

setup:
  - cmd: "go build -o blis ."
    description: "Build the BLIS simulator"

arms:
  - arm_id: "h-main"
    conditions:
      - name: "baseline-pt-r30"
        cmd: "./blis run --model qwen/qwen3-14b --prefill-instances 1 --decode-instances 1 --num-instances 2 --pd-decider prefix-threshold --pd-prefix-threshold 16 --rate 30 --num-requests 2000 --prompt-tokens 512 --prefix-tokens 480 --output-tokens 128 --seed 42 --metrics-path /Users/vishakha/git-repos/llm-git-repos/inference-sim/.nous/dpp-vs-prefix-threshold/runs/iter-2/results/h-main/baseline_pt_r30.json 2>/dev/null"
